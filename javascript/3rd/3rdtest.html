<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"> <!-- 한글 및 다국어 깨지지 않게 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 기기의 화면 맞춤-->
    <meta http-equiv="X-UA-Compatible" content="ie=edge"> <!-- 문서를 랜더링 하도록 지시-->
    <title>나이계산</title>
    <style>
        body {
            font-size: 1.3em;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>나이 계산하기 </h1>

    <script>
     var birth = prompt("태어난 연도를 입력하세요:");
     var age = 2026 - birth;

     document.write("<b><big>당신의 나이는" + age + "</big></b>살입니다.");
     </script>
</body>
</html>
