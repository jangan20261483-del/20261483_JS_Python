<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Loops</h1>
<h2>The do...while Loop</h2>

<p id="demo"></p>

<script>
let i = 0;
let sum = 0;

do {
    sum += i;
    i += 5;
}
while (i <= 100);

document.getElementById("demo").innerHTML =
    "The number is " + sum;
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Loops</h1>
<h2>The continue Statement</h2>

<p id="demo"></p>

<script>
let text = "";

for (let i = 10; i > 0; i--) {
    if (i === 3) {
        continue;
    }
    text += i + "<br>";
}

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
