
<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Day 계산</title>
</head>
<body>
    <div class="container">
        <div class="day1">
            <h3>태어난 지</h3>
            <p>시작 날짜 : <strong id="startDate"></strong></p>
            <p id="accent" class="accent">0일</p>
        </div>

        <div class="bar">기념일 계산</div>

        <div class="day2">
            <ul>
                <li class="item-title">100일</li>
                <li class="item-date" id="date100"></li>
            </ul>
            <ul>
                <li class="item-title">200일</li>
                <li class="item-date" id="date200"></li>
            </ul>
            <ul>
                <li class="item-title">1년</li>
                <li class="item-date" id="date365"></li>
            </ul>
            <ul>
                <li class="item-title">500일</li>
                <li class="item-date" id="date500"></li>
            </ul>
            <ul>
                <li class="item-title">700일</li>
                <li class="item-date" id="date700"></li>
            </ul>
            <ul>
                <li class="item-title">1000일</li>
                <li class="item-date" id="date1000"></li>
            </ul>
        </div>
    </div>

    <script src="10rd.js"></script>
</body>
</html>
